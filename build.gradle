import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.tokenenvoy' version '3.0.0'
}

group = root_package
version = mod_version
base.archivesName = 'ae2-wireless-extensions'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Resolve the JDK 25 dev environment while emitting Java 8 mod classes.
configurations.matching {
    it.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
}.configureEach {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC'
                url 'https://maven.cleanroommc.com'
            }
        }
        filter { includeGroup 'mezz' }
    }
}

// Every jar dropped into libs/ is deobfuscated for compile and runtime.
def localLibs = fileTree(dir: 'libs', include: '*.jar').files

dependencies {
    implementation cleanroom.userdev(cleanroom_version) {
        if (access_transformers) {
            accessTransformers.from(access_transformers.tokenize().collect { "src/main/resources/META-INF/$it" })
        }
    }
    implementation deobf('curse.maven:ae2-extended-life-570458:6302098')
    if (!localLibs.isEmpty()) {
        implementation deobf(files(localLibs))
    }
    if (depend_on_hei.toBoolean()) {
        implementation 'mezz:jei:4.36.1:dev'
    } else {
        runtimeOnly 'mezz:jei:4.36.1:dev'
    }
    testImplementation 'junit:junit:4.13.2'
}

tokenEnvoy {
    set 'MOD_ID', mod_id
    set 'MOD_NAME', mod_name
    set 'MOD_VERSION', project.version
    set 'MOD_DESCRIPTION', mod_description
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set 'MOD_CREDITS', mod_credits
    set 'MOD_URL', mod_url
    set 'MOD_UPDATE_JSON', mod_update_json
    set 'MOD_LOGO_PATH', mod_logo_path
}

jar {
    manifest {
        attributes 'MixinConfigs': 'mixins.me_wireless.json'
        if (access_transformers) {
            attributes 'FMLAT': access_transformers.tokenize().join(' ')
        }
        if (coremod_plugin_class) {
            attributes 'FMLCorePlugin': coremod_plugin_class
            if (coremod_includes_mod.toBoolean()) {
                attributes 'FMLCorePluginContainsFMLMod': true, 'ForceLoadAsMod': true
            }
        }
    }
    from('LICENSE') { into 'META-INF' }
}

// TODO: fundamental Foundation issue
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}

// The reobfuscation subprocess runs on JDK 8; keep its heap explicit so it does
// not try to reserve a heap larger than the available address space.
tasks.matching { it.name.startsWith('reobf') }.configureEach {
    if (it instanceof JavaExec) {
        maxHeapSize = '1G'
    }
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                args '--mixin', 'mixins.me_wireless.json'
                if (extra_jvm_args) {
                    jvmArgs extra_jvm_args.tokenize()
                }
            }
        }
        server {
            configure {
                args '--mixin', 'mixins.me_wireless.json'
                if (extra_jvm_args) {
                    jvmArgs extra_jvm_args.tokenize()
                }
            }
        }
    }
}

test {
    useJUnit()
}
